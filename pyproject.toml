[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-trading-engine"
version = "0.1.0"
description = "Deterministic XAUUSD trading engine with optional Hermes validation"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
trading-engine = "ai_trading_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
